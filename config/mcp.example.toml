# Example MCP configuration for Jarvis
#
# Merge into ~/.config/jarvis/config.toml. Servers are started at daemon
# startup over stdio. Their tools are namespaced as `mcp.<server>.<tool>` and
# go through the permission system exactly like built-in tools.
#
# Paths beginning with `sidecars/` (or `${SIDECAR_DIR}`) are resolved at load
# time to the sidecars shipped with this checkout, so no absolute path or
# `/tmp` copy is needed.
#
# Tool selection
# --------------
# MCP servers are offered to the model only when the request needs them:
#   * the request names the server or one of its tools,
#   * the server sets `always_offer = true`, or
#   * the request needs the web and the server is a web server
#     (fetch/search/web/browser/http/crawl).
#
# Keep `always_offer` off for servers with a large tool surface: every offered
# tool costs prompt budget and attention, and small local models degrade
# quickly as the menu grows.

[mcp]
[[mcp.servers]]
name = "fetch"
# Runs the fetch server from this repository. It returns clean text, with
# HTML tags, scripts and styles removed.
command = "python3"
args = ["sidecars/fetch/server.py"]
enabled = true
always_offer = false
env = {}

[[mcp.servers]]
name = "search"
# Finds pages to then fetch. Keyless backends are Wikipedia and DuckDuckGo
# Instant Answers. General web search needs one of these:
#
#   env = { JARVIS_SEARX_URL = "https://your-searxng.example" }
#   env = { JARVIS_BRAVE_KEY = "..." }
#
# Without one, `search` still answers factual questions from Wikipedia, which
# is what most "what is X" and "latest version of X" requests need. The result
# names the backend that produced it, so coverage is never implied.
command = "python3"
args = ["sidecars/search/server.py"]
enabled = true
always_offer = false
env = {}

# The MCP filesystem server duplicates the built-in `filesystem.*` tools,
# which run in-process and are already integrated with the permission
# system. Enabling both doubles the tool surface for no new capability, so
# this server is off by default. Turn it on only if you need a feature the
# built-ins lack (for example `move_file` or media reads), and prefer
# `always_offer = false`.
#
# [[mcp.servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/you"]
# enabled = false
# always_offer = false

