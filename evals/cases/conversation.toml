# Plain conversation. No tool may be involved, and the answer comes from the
# model alone, so these measure the model more than the code.

[[case]]
id = "chat.greeting"
input = "hello there"
tags = ["conversation"]
note = "Any friendly reply is right. An earlier version required the word 'hello' and failed 'I'm here to help. What's on your mind?'."
[case.expect]
route = "Direct"
tools = []
excludes = ["tool_call", "\"name\":", "could not reach the local model"]

[[case]]
id = "chat.identity"
input = "who are you?"
tags = ["conversation"]
note = "The system prompt names the assistant; a model that ignores it answers as itself."
[case.expect]
route = "Direct"
tools = []
contains = ["jarvis"]

[[case]]
id = "chat.arithmetic"
input = "what is 2+2"
tags = ["conversation"]
[case.expect]
route = "Direct"
tools = []
contains_any = ["4", "four"]

[[case]]
id = "chat.stable_fact"
input = "when did the second world war end"
tags = ["conversation"]
note = "A historical fact with no recency marker must not trigger a web search."
[case.expect]
route = "Direct"
tools = []
contains = ["1945"]

[[case]]
id = "memory.name"
setup = ["my name is Ada Lovelace"]
input = "what is my name?"
tags = ["conversation", "memory"]
note = "The earlier turn is in session history; the answer must use it."
[case.expect]
route = "Direct"
tools = []
contains = ["ada"]

[[case]]
id = "memory.preference"
setup = ["I prefer tea over coffee"]
input = "which drink do I prefer?"
tags = ["conversation", "memory"]
[case.expect]
tools = []
contains = ["tea"]

[[case]]
id = "memory.correction"
setup = ["my name is Ada", "actually, please call me Grace instead"]
input = "what should you call me?"
tags = ["conversation", "memory"]
note = "The later statement wins. A model that matches the first name it saw answers Ada."
[case.expect]
tools = []
contains = ["grace"]

[[case]]
id = "memory.followup_file"
setup = ["read {sandbox}/notes.txt"]
files = { "notes.txt" = "buy oat milk" }
input = "how many words are in that file?"
tags = ["conversation", "memory", "filesystem"]
note = "'that file' refers to the previous turn. Three words."
[case.expect]
contains_any = ["3", "three"]
