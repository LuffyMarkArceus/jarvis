[workspace]
resolver = "2"
members = ["core", "cli", "tui", "common"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["shrey"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Full debug info is most of a dev build's size. Line tables keep file:line in
# panics and backtraces; switch to `debug = true` locally to use a debugger.
[profile.dev]
debug = "line-tables-only"
