name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Pinned to a specific image: `ubuntu-latest` is scheduled to move to
    # Ubuntu 26, and a silent image change is not a CI failure worth debugging.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Pinned so a new clippy lint on `stable` cannot fail a pull request
      # that changed nothing related to it. Bump both jobs together.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Run tests
        run: cargo test --workspace
      - name: Test sidecars
        run: |
          python3 -m unittest discover -s sidecars/fetch -p 'test_*.py'
          python3 -m unittest discover -s sidecars/search -p 'test_*.py'
          python3 -m unittest discover -s evals -p 'test_*.py'

  lint:
    # Pinned to a specific image: `ubuntu-latest` is scheduled to move to
    # Ubuntu 26, and a silent image change is not a CI failure worth debugging.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
